  <path d="M540 180 H592 M552 180 L554 238 H576 L578 180"/>
  <!-- peroné: trazo grueso -->
  <path d="M606 184 C606 180 614 180 614 184 L613 238 C613 243 607 243 607 238 Z" stroke-width="3"/>
</g>

