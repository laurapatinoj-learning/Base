  <text x="436" y="178" font-size="12" fill="#000" stroke="none">Papio</text>
</g>

<!-- B. Huesos de la pierna: fémur, tibia y peroné (resaltado) -->
<g id="leg">
  <path d="M564 70 V254" stroke-width="0.8" stroke-dasharray="14 3 2 3"/>
