# Sitio estático: carpeta plana de HTML autónomos (generada por scripts/build-html.mjs, tres idiomas).
[build]
  command = "node --disable-warning=ExperimentalWarning scripts/build-html.mjs"
  publish = "html"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Los HTML llevan CSS y JS incrustados, por eso 'unsafe-inline'.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"
