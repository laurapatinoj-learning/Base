<title>KMS Movies</title>

<style>
/* Concepto: cine nocturno en neón. Pantalla grande para el organizador, tarjetas táctiles para cada participante. */
:root {
  --ink: #0d0a24;
  --ink-2: #1b1346;
  --panel: #271c66;
  --panel-2: #33257f;
  --line: rgba(255, 255, 255, .16);
  --fg: #ffffff;
  --mut: #c4bdf0;
  --pink: #ff3b8d;
  --amber: #ffc21a;
  --cyan: #22d3ee;
  --lime: #7cf24a;
  --violet: #8b5cf6;
  --a0: #ff3355;
  --a1: #2f7bff;
  --a2: #ffc21a;
  --a3: #2ed36a;
  --a4: #a855f7;
  --font-display: "Lilita One", "Arial Black", Impact, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.35;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--ink); }
.bg i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 22s ease-in-out infinite alternate; }
.bg i:nth-child(1) { background: #6d28d9; left: -20vmax; top: -20vmax; }
.bg i:nth-child(2) { background: #db2777; right: -25vmax; top: 10vmax; animation-duration: 28s; opacity: .4; }
.bg i:nth-child(3) { background: #0ea5e9; left: 10vmax; bottom: -35vmax; animation-duration: 25s; opacity: .35; }
@keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
h1, h2, h3, .display { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.narrow { max-width: 520px; }

/* botones */
.btn { appearance: none; border: 0; border-radius: 16px; padding: 14px 24px; font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .03em; color: #1a1033; background: var(--amber); box-shadow: 0 6px 0 #a87a00; transition: transform .08s, box-shadow .08s, filter .15s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #a87a00; }
.btn.pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 #a0155a; }
.btn.pink:active { box-shadow: 0 1px 0 #a0155a; }
.btn.cyan { background: var(--cyan); box-shadow: 0 6px 0 #0a7f95; }
.btn.cyan:active { box-shadow: 0 1px 0 #0a7f95; }
.btn.ghost { background: rgba(255,255,255,.1); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.35); border: 2px solid var(--line); }
.btn.big { font-size: 1.7rem; padding: 18px 34px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(.4); }
.btn.sm { font-size: 1rem; padding: 8px 14px; border-radius: 12px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }

.card { background: linear-gradient(160deg, var(--panel), var(--ink-2)); border: 2px solid var(--line); border-radius: 24px; padding: 20px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 900; font-size: .9rem; color: #14102b; background: var(--amber); white-space: nowrap; }
.chip.dark { background: rgba(255,255,255,.12); color: #fff; border: 1px solid var(--line); }
.mut { color: var(--mut); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.between { justify-content: space-between; }
.center { text-align: center; justify-content: center; }
.grow { flex: 1; min-width: 0; }

/* portada */
.hero-img { width: 100%; border-radius: 28px; border: 4px solid rgba(255,255,255,.2); box-shadow: 0 20px 60px rgba(0,0,0,.5); display: block; }
.role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.role { text-align: left; border-radius: 24px; padding: 22px; border: 0; display: flex; flex-direction: column; gap: 8px; color: #14102b; transition: transform .12s; }
.role:hover { transform: translateY(-4px) rotate(-.5deg); }
.role h2 { font-size: 2rem; }
.role p { margin: 0; font-weight: 800; }
.role.host { background: linear-gradient(135deg, var(--amber), #ff9a1a); box-shadow: 0 8px 0 #9a5d00; }
.role.play { background: linear-gradient(135deg, var(--cyan), #5eead4); box-shadow: 0 8px 0 #0a7f95; }
.film-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.film { border-radius: 18px; padding: 14px 16px; color: #14102b; display: flex; flex-direction: column; gap: 2px; }
.film b { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; }
.film span { font-weight: 800; font-size: .9rem; }

/* pin */
.pin { font-family: var(--font-display); font-size: clamp(3.2rem, 11vw, 7rem); letter-spacing: .12em; line-height: 1; color: #fff; text-shadow: 0 6px 0 var(--pink), 0 0 36px rgba(255,59,141,.6); }
.marquee { display: inline-block; padding: 10px 26px; border-radius: 18px; background: linear-gradient(#ffe066, #ffb300); border: 5px solid #ff3b3b; color: #14102b; box-shadow: 0 0 36px rgba(255,194,26,.55); font-family: var(--font-display); font-size: 1.2rem; letter-spacing: .08em; }
.players { display: flex; flex-wrap: wrap; gap: 10px; }
.pl { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid var(--line); font-weight: 800; animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); max-width: 100%; }
.pl .av { width: 32px; height: 32px; }
.pl button { background: none; border: 0; color: var(--mut); padding: 0 0 0 4px; font-size: 1.1rem; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #14102b; font-family: var(--font-display); font-size: 1.1rem; flex: none; }
.toggle { display: inline-flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 16px; border: 2px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; font-weight: 900; }
.toggle input { accent-color: var(--amber); width: 20px; height: 20px; }
.toggle .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.seg { display: inline-flex; border-radius: 16px; overflow: hidden; border: 2px solid var(--line); }
.seg button { background: transparent; border: 0; padding: 10px 16px; font-weight: 900; }
.seg button[aria-pressed="true"] { background: var(--amber); color: #14102b; }
.vid { width: 100%; border-radius: 20px; border: 3px solid rgba(255,255,255,.2); background: #000; aspect-ratio: 16 / 9; display: block; }

/* cabecera de pregunta */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .trk { stroke: rgba(255,255,255,.14); }
.ring .bar { stroke: var(--cyan); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset .12s linear, stroke .3s; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 400; font-size: 2rem; }
.ring.warn .bar { stroke: var(--amber); }
.ring.hot .bar { stroke: var(--pink); }
.ring.hot { animation: beat .5s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.1); } }
.qtext { font-family: var(--font-display); font-size: clamp(1.6rem, 4.2vw, 3rem); line-height: 1.12; text-align: center; padding: 22px 18px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opts.three { grid-template-columns: 1fr; }
.opt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 14px 18px; border: 0; border-radius: 18px; text-align: left; color: #fff; font-weight: 900; font-size: clamp(1.05rem, 2.4vw, 1.6rem); box-shadow: 0 7px 0 rgba(0,0,0,.35); transition: transform .08s, opacity .3s, filter .3s; }
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; z-index: 1; }
.opt svg { width: 34px; height: 34px; flex: none; fill: rgba(255,255,255,.95); z-index: 1; }
.opt.c2 { color: #1d1500; }
.opt.c2 svg { fill: #1d1500; }
.opt .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.28); width: 0; transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.opt .n { z-index: 1; font-family: var(--font-display); font-size: 1.5rem; }
.opt.dim { opacity: .3; filter: grayscale(.7); }
.opt.right { outline: 5px solid #fff; transform: scale(1.02); }
button.opt:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
button.opt[aria-pressed="true"] { outline: 5px solid #fff; transform: scale(1.02); }
.opt .tick { display: none; z-index: 1; font-family: var(--font-display); font-size: 1.6rem; }
.opt.right .tick { display: block; }
.c0 { background: var(--a0); } .c1 { background: var(--a1); } .c2 { background: var(--a2); } .c3 { background: var(--a3); } .c4 { background: var(--a4); }
.hint { font-size: 1.1rem; color: var(--mut); text-align: center; }

/* respuestas especiales */
.field { width: 100%; font: inherit; font-weight: 900; font-size: 1.5rem; padding: 16px 18px; border-radius: 16px; border: 3px solid var(--line); background: rgba(0,0,0,.35); color: #fff; text-align: center; }
.field::placeholder { color: rgba(255,255,255,.45); }
.field:focus { border-color: var(--cyan); outline: none; }
.slider-val { font-family: var(--font-display); font-size: clamp(3rem, 14vw, 5.5rem); text-align: center; line-height: 1; text-shadow: 0 5px 0 var(--pink); }
input[type=range] { width: 100%; height: 44px; accent-color: var(--amber); }
.ord { display: grid; gap: 10px; }
.ord button { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 16px; border: 3px solid var(--line); background: rgba(255,255,255,.08); font-weight: 900; font-size: 1.15rem; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
.ord .num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.4rem; background: rgba(0,0,0,.3); flex: none; }
.ord button[aria-pressed="true"] { background: var(--cyan); color: #06303a; border-color: #fff; }
.ord button[aria-pressed="true"] .num { background: #06303a; color: var(--cyan); }
.ord.solid li { list-style: none; }
.done { text-align: center; padding: 36px 16px; display: grid; gap: 10px; place-items: center; }
.done .big-check { width: 110px; height: 110px; border-radius: 50%; background: var(--a3); display: grid; place-items: center; font-family: var(--font-display); font-size: 4rem; box-shadow: 0 8px 0 #167a3a; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.timebar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
.timebar i { display: block; height: 100%; width: 100%; background: var(--cyan); border-radius: 99px; transition: width .12s linear, background .3s; }
.timebar.warn i { background: var(--amber); } .timebar.hot i { background: var(--pink); }

/* resultados */
.stat { display: grid; gap: 6px; text-align: center; }
.stat .num { font-family: var(--font-display); font-size: clamp(2.4rem, 9vw, 4rem); line-height: 1; }
.res-hero { text-align: center; padding: 28px 16px; border-radius: 28px; border: 4px solid rgba(255,255,255,.25); display: grid; gap: 8px; }
.res-hero.ok { background: linear-gradient(160deg, #1aa851, #0f6d35); }
.res-hero.part { background: linear-gradient(160deg, #e69a00, #a35d00); }
.res-hero.bad { background: linear-gradient(160deg, #e0284d, #8d1033); }
.res-hero.none { background: linear-gradient(160deg, #4b3f9a, #2a2170); }
.res-hero h2 { font-size: clamp(2rem, 8vw, 3.2rem); }
.pts { font-family: var(--font-display); font-size: 2.4rem; }
.board { display: grid; gap: 10px; }
.brow { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 18px; background: rgba(255,255,255,.08); border: 1px solid var(--line); overflow: hidden; }
.brow .fillbar { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(255,59,141,.55), rgba(255,194,26,.35)); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.brow > * { position: relative; }
.brow .rk { font-family: var(--font-display); font-size: 1.6rem; width: 2ch; text-align: center; }
.brow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.2rem; font-weight: 900; }
.brow .sc { font-family: var(--font-display); font-size: 1.5rem; }
.brow .st { font-size: .85rem; color: var(--amber); }
.brow.me { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber) inset; }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; min-height: 300px; }
.pod { display: grid; gap: 8px; justify-items: center; text-align: center; min-width: 0; }
.pod .nm { font-weight: 900; font-size: 1.2rem; overflow-wrap: anywhere; }
.pod .col { width: 100%; border-radius: 18px 18px 0 0; display: grid; place-items: start center; padding-top: 12px; font-family: var(--font-display); font-size: 3rem; color: #14102b; animation: rise 1s cubic-bezier(.2, .8, .2, 1) both; }
.pod.p1 .col { height: 190px; background: linear-gradient(#ffe066, #ffb300); }
.pod.p2 .col { height: 140px; background: linear-gradient(#e5e7f5, #a7acd0); animation-delay: .25s; }
.pod.p3 .col { height: 100px; background: linear-gradient(#ffb27a, #c26a2a); animation-delay: .5s; }
@keyframes rise { from { transform: scaleY(0); transform-origin: bottom; } }
.pod .av { width: 64px; height: 64px; font-size: 1.8rem; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: #fff; color: #14102b; padding: 12px 20px; border-radius: 14px; font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 90vw; }
canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
.spin { width: 44px; height: 44px; border-radius: 50%; border: 6px solid rgba(255,255,255,.2); border-top-color: var(--amber); animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.err { color: #ffd0dc; background: rgba(255,51,85,.25); border: 2px solid var(--a0); border-radius: 14px; padding: 10px 14px; }
label.lbl { display: grid; gap: 6px; font-weight: 900; }
.lbl span { color: var(--mut); font-size: .9rem; text-transform: uppercase; letter-spacing: .08em; }
.sticky-act { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
@media (max-width: 620px) {
  .opts { grid-template-columns: 1fr; }
  .opt { min-height: 66px; }
  .podium { min-height: 240px; }
  .pod.p1 .col { height: 150px; } .pod.p2 .col { height: 110px; } .pod.p3 .col { height: 80px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>

    case "tf": return a === (q.c ? 0 : 1) ? 1 : 0;
    case "multi": { const cs = new Set(q.c), sel = Array.isArray(a) ? a : []; let h = 0, b = 0; sel.forEach(i => cs.has(i) ? h++ : b++); return Math.max(0, (h - b) / cs.size); }

    default: return 0;
  }
}

function onGame() {
  if (S.role === "play") playUpdate();
  else if (S.role === "host" && H.waitingResume) { H.waitingResume = false; enterHost(); }

/* ========= ORGANIZADOR ========= */
const H = { G: null, picks: { poeta: true, contador: true, tropic: true }, mode: "full", q: null, qStart: 0, revealing: false, players: {}, answers: {}, unsubP: null, unsubA: null, q_: Promise.resolve(), waitingResume: false };

function commit(patch) {
  H.G = { ...H.G, ...patch, seq: (H.G.seq || 0) + 1 };
  const snap = JSON.parse(JSON.stringify(H.G));
  H.q_ = H.q_.then(() => S.db.doc("games/current").set(snap)).catch(e => toast("No se pudo guardar el estado de la partida (" + (e.code || e.message) + ")"));
  return H.q_;
}

function enterHost() {
  S.role = "host";
  if (!S.db) return view(`<div class="card"><h2>Sin acceso a la base de datos</h2><p>Abre la página con tu sesión de Claude para organizar.</p><button class="btn" id="back">Volver</button></div>`), $("#back").onclick = () => { location.hash = ""; landing(); };

  view(`
    <div class="top between"><div class="row">${filmChip(q.film)}<span class="chip dark">${q.n + 1}/${g.qs.length}</span></div>${ringHTML("ring")}</div>
    <div class="card"><div class="qtext" style="font-size:clamp(1.3rem,5vw,2rem);padding:12px 6px">${esc(q.text)}</div></div>
    <div id="inp" style="display:grid;gap:12px"></div>`);
  const box = $("#inp");
    const submit = async (a, auto) => {
    if (P.locked && !auto) return;
    P.locked = true;
    const rt = Math.min(Date.now() - P.started, q.dur * 1000);
    try { await S.db.doc("answers/" + S.uid).set({ code: g.code, qn: g.qn, a, rt, t: Date.now() }); }
    catch (e) { P.locked = false; return toast("No se pudo enviar. Inténtalo otra vez."); }
    navigator.vibrate?.(30); beep(520, .08, "triangle");
    box.innerHTML = `<div class="done"><div class="big-check">✓</div><h2>¡Respuesta enviada!</h2><p class="mut">Esperando a los demás…</p></div>`;
  };
  if (q.type === "mc" || q.type === "tf" || q.type === "poll") {
    box.innerHTML = `<div class="opts">${q.opts.map((o, i) => { const ci = q.type === "tf" ? (i === 0 ? 1 : 0) : i; return `<button class="opt c${ci}" data-i="${i}">${shape(ci)}<span class="t">${esc(o)}</span></button>`; }).join("")}</div>`;
    $$("button.opt", box).forEach(b => b.onclick = () => submit(+b.dataset.i));
  } else if (q.type === "multi") {
    box.innerHTML = `<div class="hint">Marca todas las que correspondan</div><div class="opts three">${q.opts.map((o, i) => `<button class="opt c${i}" data-i="${i}" aria-pressed="false">${shape(i)}<span class="t">${esc(o)}</span><span class="tick" style="display:none"></span></button>`).join("")}</div><div class="sticky-act"><button class="btn big pink" id="send" disabled>Enviar</button></div>`;
    $$("button.opt", box).forEach(b => b.onclick = () => { if (P.locked) return; const i = +b.dataset.i, on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); P.sel = on ? [...P.sel, i] : P.sel.filter(x => x !== i); $("#send").disabled = !P.sel.length; });
    $("#send").onclick = () => submit([...P.sel].sort((a, b) => a - b));
  } else if (q.type === "type") {
    box.innerHTML = `<input class="field" id="txt" placeholder="Escribe tu respuesta" autocomplete="off" autocapitalize="words" maxlength="40"><button class="btn big pink" id="send">Enviar</button>`;
    const go = () => { const v = $("#txt").value.trim(); if (v) submit(v); }; $("#send").onclick = go; $("#txt").onkeydown = e => { if (e.key === "Enter") go(); };
  } else if (q.type === "slider") {
    const mid = Math.round((q.min + q.max) / 2); P.sel = mid;
    box.innerHTML = `<div class="slider-val" id="sv">${mid}</div><input type="range" id="rg" min="${q.min}" max="${q.max}" step="${q.step}" value="${mid}" aria-label="Tu respuesta"><div class="row between mut"><span>${q.min}</span><span>${q.max}</span></div><button class="btn big pink" id="send">Enviar</button>`;
    $("#rg").oninput = e => { P.sel = +e.target.value; $("#sv").textContent = P.sel; }; $("#send").onclick = () => submit(P.sel);
  } else if (q.type === "order") {
    box.innerHTML = `<div class="hint">Toca en el orden correcto</div><div class="ord">${q.opts.map((o, i) => `<button data-i="${i}" aria-pressed="false"><span class="num">·</span>${esc(o)}</button>`).join("")}</div><div class="row center"><button class="btn ghost sm" id="reset">Reiniciar</button><button class="btn big pink" id="send" disabled>Enviar</button></div>`;
    const paint = () => $$(".ord button", box).forEach(b => { const k = P.sel.indexOf(+b.dataset.i); b.setAttribute("aria-pressed", String(k >= 0)); b.querySelector(".num").textContent = k >= 0 ? k + 1 : "·"; });
    $$(".ord button", box).forEach(b => b.onclick = () => { if (P.locked) return; const i = +b.dataset.i; if (!P.sel.includes(i)) P.sel.push(i); paint(); $("#send").disabled = P.sel.length !== q.opts.length; });
    $("#reset").onclick = () => { if (P.locked) return; P.sel = []; paint(); $("#send").disabled = true; };
    $("#send").onclick = () => submit([...P.sel]);
  }
  runTimer(P.started, q.dur * 1000, (rem, d) => paintRing("ring", rem, d), () => {
    if (P.locked) return;
    const has = (q.type === "multi" && P.sel.length) || (q.type === "slider") || (q.type === "type" && $("#txt")?.value.trim());
    if (has) { submit(q.type === "type" ? $("#txt").value.trim() : q.type === "multi" ? [...P.sel].sort((a, b) => a - b) : P.sel, true); }
    else { P.locked = true; box.innerHTML = `<div class="done"><h2>¡Se acabó el tiempo!</h2><p class="mut">Mira la pantalla para ver la respuesta.</p></div>`; }
  });
}
function playResult() {
  const g = S.game, q = g.q, rv = g.reveal, me = myScore(); if (!q || !rv) return;
  const list = rankList(g.scores, g.roster), mine = list.find(r => r.u === S.uid);
  let cls = "none", h = "Sin respuesta", sub = "Esta vez no alcanzaste a responder.";
  if (me) {
    if (me.ok === 1) { cls = "ok"; h = "¡Correcto!"; sub = me.st >= 2 ? `Racha de ${me.st} aciertos` : "Bien hecho"; }
    else if (me.ok === 0.5) { cls = "part"; h = "¡Casi!"; sub = "Acertaste una parte."; }
    else if (me.ok === 0) { cls = "bad"; h = "Incorrecto"; sub = "No pasa nada, la siguiente es tuya."; }
    else if (me.ok === 2) { cls = "ok"; h = "¡Voto registrado!"; sub = "Las encuestas no suman puntos."; }
  }
  view(`
    <div class="res-hero ${cls}"><h2>${h}</h2><div>${sub}</div>${q.type !== "poll" ? `<div class="pts">+${me?.p || 0}</div>` : ""}</div>
    ${q.type !== "poll" ? `<div class="card"><div class="mut">Respuesta correcta</div><div style="font-family:var(--font-display);font-size:1.5rem">${esc(rv.ctext)}</div><p class="mut" style="margin:6px 0 0">${esc(rv.expl)}</p></div>` : ""}
    <div class="row"><div class="card grow stat"><span class="mut">Tu puntaje</span><span class="num">${me?.s || 0}</span></div><div class="card grow stat"><span class="mut">Posición</span><span class="num">${mine ? mine.rk : "–"}º</span></div></div>`);
  if (me && q.type !== "poll") { jingle(me.ok === 1); navigator.vibrate?.(me.ok === 1 ? [40, 40, 40] : 120); }
}
function playBoard() {
  const g = S.game, list = rankList(g.scores, g.roster);
  const me = list.find(r => r.u === S.uid), top = list.slice(0, 5);
  const rest = me && me.rk > 5 ? [me] : [];
  view(`<h1 style="font-size:2.2rem;text-align:center">Ranking</h1><div class="card">${boardHTML([...top, ...rest], 6, S.uid)}</div><p class="hint">Atento a la pantalla. Viene la siguiente pregunta.</p>`);
  animateBars();
}
function playEnd() {
  const g = S.game, list = rankList(g.scores, g.roster), me = list.find(r => r.u === S.uid);
  view(`<div class="res-hero ${me && me.rk <= 3 ? "ok" : "none"}"><h2>${me ? (me.rk === 1 ? "¡Campeón del cine!" : me.rk <= 3 ? "¡Subiste al podio!" : "¡Buena partida!") : "Partida terminada"}</h2>
    ${me ? `<div class="pts">${me.rk}º lugar · ${me.s} pts</div>` : ""}</div>
    <div class="card"><h2 style="font-size:1.5rem;margin-bottom:10px">Clasificación</h2>${boardHTML(list, 15, S.uid)}</div>
    <div class="row center"><button class="btn ghost" id="home">Salir</button></div>`);
  animateBars(); if (me && me.rk <= 3) confetti();
  $("#home").onclick = () => { P.joinedCode = null; location.hash = ""; landing(); };
}

boot();
</script>
