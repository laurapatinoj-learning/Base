<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a24">
<title>KMS Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Concepto: sala de cine en neón. Cada película tiñe la interfaz con su propio color (--film). */
:root {
  --ink: #0d0a24; --ink-2: #1b1346; --panel: #271c66;
  --line: rgba(255,255,255,.16); --fg: #fff; --mut: #c4bdf0;
  --pink: #ff3b8d; --amber: #ffc21a; --cyan: #22d3ee; --lime: #7cf24a; --violet: #8b5cf6;
  --film: #ffc21a;
  --a0: #ff3355; --a1: #2f7bff; --a2: #ffc21a; --a3: #2ed36a; --a4: #a855f7;
  --font-display: "Lilita One", "Arial Black", Impact, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--font-body); font-weight: 800; font-size: 16px; line-height: 1.35; overflow-x: hidden;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); transition: box-shadow .4s; }
body.hot { animation: vignette .9s ease-in-out infinite; }
@keyframes vignette { 0%,100% { box-shadow: inset 0 0 0 rgba(255,51,85,0); } 50% { box-shadow: inset 0 0 120px rgba(255,51,85,.55); } }
#bg { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; display: block; }
h1,h2,h3 { font-family: var(--font-display); font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.narrow { max-width: 520px; margin-inline: auto; width: 100%; }
.screen > * { animation: rise .5s cubic-bezier(.2,.9,.3,1.2) both; }
.screen > *:nth-child(2) { animation-delay: .06s; } .screen > *:nth-child(3) { animation-delay: .12s; } .screen > *:nth-child(4) { animation-delay: .18s; } .screen > *:nth-child(5) { animation-delay: .24s; } .screen > *:nth-child(6) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.97); } }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }

.btn { position: relative; overflow: hidden; appearance: none; border: 0; border-radius: 16px; padding: 14px 24px; font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .03em; color: #1a1033; background: var(--amber); box-shadow: 0 6px 0 #a87a00; transition: transform .08s, box-shadow .08s, filter .15s; }
.btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #a87a00; }
.btn.pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 #a0155a; } .btn.pink:active { box-shadow: 0 1px 0 #a0155a; }
.btn.cyan { background: var(--cyan); box-shadow: 0 6px 0 #0a7f95; } .btn.cyan:active { box-shadow: 0 1px 0 #0a7f95; }
.btn.ghost { background: rgba(255,255,255,.1); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.35); border: 2px solid var(--line); }
.btn.big { font-size: 1.7rem; padding: 18px 34px; } .btn.sm { font-size: 1rem; padding: 8px 14px; border-radius: 12px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(.4); transform: none; }
.ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.55); transform: scale(0); animation: rip .6s ease-out forwards; pointer-events: none; }
@keyframes rip { to { transform: scale(4); opacity: 0; } }
.card { background: linear-gradient(160deg, var(--panel), var(--ink-2)); border: 2px solid var(--line); border-radius: 24px; padding: 20px; backdrop-filter: blur(6px); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 900; font-size: .9rem; color: #14102b; background: var(--film); white-space: nowrap; }
.chip.dark { background: rgba(255,255,255,.12); color: #fff; border: 1px solid var(--line); }
.mut { color: var(--mut); } .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; } .between { justify-content: space-between; } .center { text-align: center; justify-content: center; } .grow { flex: 1; min-width: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }

/* portada */
.logo { text-align: center; display: grid; gap: 4px; justify-items: center; padding-top: 8px; }
.logo .kms { font-family: var(--font-display); font-size: clamp(5rem, 24vw, 11rem); line-height: .95; display: flex; gap: .04em; }
.logo .kms span { color: #fff; -webkit-text-stroke: .06em #14102b; paint-order: stroke fill; display: inline-block; animation: slam .8s cubic-bezier(.2,1.6,.4,1) both, bob 3.2s ease-in-out infinite; }
.logo .kms span:nth-child(1) { text-shadow: 0 .06em 0 var(--pink), 0 0 .3em var(--pink); animation-delay: .1s, .9s; }
.logo .kms span:nth-child(2) { text-shadow: 0 .06em 0 var(--amber), 0 0 .3em var(--amber); animation-delay: .25s, 1.1s; }
.logo .kms span:nth-child(3) { text-shadow: 0 .06em 0 var(--cyan), 0 0 .3em var(--cyan); animation-delay: .4s, 1.3s; }
@keyframes slam { from { transform: translateY(-120%) rotate(-25deg) scale(1.6); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-8px) rotate(1.5deg); } }
.marquee { position: relative; display: inline-block; padding: 8px 30px; border-radius: 16px; background: linear-gradient(#ffe066,#ffb300); border: 5px solid #ff3b3b; color: #14102b; box-shadow: 0 0 36px rgba(255,194,26,.6); font-family: var(--font-display); font-size: 1.5rem; letter-spacing: .12em; animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 60px rgba(255,194,26,.95); } }
.role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.role { text-align: left; border-radius: 24px; padding: 22px; border: 0; display: flex; flex-direction: column; gap: 8px; color: #14102b; transition: transform .15s; transform-style: preserve-3d; }
.role h2 { font-size: 2.2rem; } .role p { margin: 0; }
.role.host { background: linear-gradient(135deg, var(--amber), #ff9a1a); box-shadow: 0 8px 0 #9a5d00; }
.role.play { background: linear-gradient(135deg, var(--cyan), #5eead4); box-shadow: 0 8px 0 #0a7f95; }
.posters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.poster { position: relative; aspect-ratio: 16/10; border-radius: 22px; overflow: hidden; border: 4px solid rgba(255,255,255,.2); transition: transform .25s, box-shadow .25s; background-size: cover; background-position: center; display: flex; align-items: flex-end; }
.poster:hover { transform: translateY(-6px) rotate(-1deg) scale(1.02); box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 0 0 4px var(--c); }
.poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(13,10,36,.92), transparent 60%); }
.poster div { position: relative; z-index: 1; padding: 12px 16px; }
.poster b { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; display: block; }
.poster span { font-size: .9rem; color: var(--mut); }

/* formularios */
.field { width: 100%; font: inherit; font-weight: 900; font-size: 1.5rem; padding: 16px 18px; border-radius: 16px; border: 3px solid var(--line); background: rgba(0,0,0,.35); color: #fff; text-align: center; }
.field::placeholder { color: rgba(255,255,255,.4); } .field:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 4px rgba(34,211,238,.25); }
label.lbl { display: grid; gap: 6px; } .lbl > span { color: var(--mut); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
.err { color: #ffd0dc; background: rgba(255,51,85,.25); border: 2px solid var(--a0); border-radius: 14px; padding: 10px 14px; animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.toggle { display: inline-flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 16px; border: 2px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; font-weight: 900; transition: transform .1s, background .2s; }
.toggle:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); } .toggle input { accent-color: var(--amber); width: 20px; height: 20px; } .toggle .dot { width: 14px; height: 14px; border-radius: 50%; }
.seg { display: inline-flex; border-radius: 16px; overflow: hidden; border: 2px solid var(--line); } .seg button { background: transparent; border: 0; padding: 10px 16px; font-weight: 900; } .seg button[aria-pressed="true"] { background: var(--amber); color: #14102b; }

/* sala */
.pin { font-family: var(--font-display); font-size: clamp(3.4rem, 12vw, 7.5rem); letter-spacing: .12em; line-height: 1; text-shadow: 0 6px 0 var(--pink), 0 0 36px rgba(255,59,141,.6); }
.lobby-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.qr { background: #fff; border-radius: 18px; padding: 10px; width: 170px; height: 170px; display: grid; place-items: center; } .qr svg { width: 100%; height: 100%; }
.players { display: flex; flex-wrap: wrap; gap: 10px; }
.pl { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid var(--line); animation: pop .4s cubic-bezier(.2,1.7,.4,1) both; max-width: 100%; transition: opacity .3s; }
.pl.off { opacity: .45; } .pl .av { width: 32px; height: 32px; } .pl button { background: none; border: 0; color: var(--mut); padding: 0 0 0 4px; font-size: 1.1rem; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #14102b; font-family: var(--font-display); font-size: 1.1rem; flex: none; border: 3px solid rgba(255,255,255,.7); }
.vid { width: 100%; border-radius: 20px; border: 3px solid rgba(255,255,255,.2); background: #000; aspect-ratio: 16/9; display: block; }

/* pregunta */
.ring { position: relative; width: 88px; height: 88px; flex: none; } .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); } .ring circle { fill: none; stroke-width: 10; } .ring .trk { stroke: rgba(255,255,255,.14); }
.ring .bar { stroke: var(--cyan); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke .3s; filter: drop-shadow(0 0 6px currentColor); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 400; font-size: 2.1rem; }
.ring.warn .bar { stroke: var(--amber); } .ring.hot .bar { stroke: var(--pink); } .ring.hot { animation: beat .5s ease-in-out infinite; } @keyframes beat { 50% { transform: scale(1.12); } }
.qcard { position: relative; overflow: hidden; } .qtext { font-family: var(--font-display); font-size: clamp(1.5rem, 4.2vw, 3rem); line-height: 1.12; text-align: center; padding: 18px 12px; }
.qcard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--film), transparent); }
.qimg { width: 100%; max-height: 38vh; object-fit: cover; border-radius: 18px; display: block; margin-top: 6px; animation: kb 8s ease-out both; }
@keyframes kb { from { transform: scale(1.12); filter: blur(6px); } to { transform: scale(1); filter: none; } }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .opts.one { grid-template-columns: 1fr; } .opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 14px 18px; border: 0; border-radius: 18px; text-align: left; color: #fff; font-weight: 900; font-size: clamp(1.05rem, 2.4vw, 1.6rem); box-shadow: 0 7px 0 rgba(0,0,0,.35); transition: transform .12s, opacity .4s, filter .4s; animation: rise .5s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--i, 0) * 80ms + 150ms); transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; z-index: 1; } .opt svg.sh { width: 34px; height: 34px; flex: none; fill: rgba(255,255,255,.95); z-index: 1; }
.opt.c2 { color: #1d1500; } .opt.c2 svg.sh { fill: #1d1500; }
.opt .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.28); width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.opt .n { z-index: 1; font-family: var(--font-display); font-size: 1.6rem; } .opt .tick { display: none; z-index: 1; font-family: var(--font-display); font-size: 1.6rem; }
.opt.dim { opacity: .28; filter: grayscale(.7); } .opt.right { outline: 5px solid #fff; transform: scale(1.03); animation: winpulse .9s ease-out; z-index: 2; } .opt.right .tick { display: block; }
@keyframes winpulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.9); } 100% { box-shadow: 0 0 0 40px rgba(255,255,255,0); } }
button.opt:hover { filter: brightness(1.1); } button.opt:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
button.opt[aria-pressed="true"] { outline: 5px solid #fff; transform: scale(1.03); }
.c0 { background: var(--a0); } .c1 { background: var(--a1); } .c2 { background: var(--a2); } .c3 { background: var(--a3); } .c4 { background: var(--a4); }
.imgtile { padding: 0; min-height: 0; aspect-ratio: 16/10; background: #000; border: 5px solid transparent; } .imgtile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.imgtile .letter { position: absolute; left: 10px; top: 10px; z-index: 2; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.4rem; color: #fff; }
.hint { font-size: 1.05rem; color: var(--mut); text-align: center; }
.statusbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.lights { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; } .lights .av { width: 38px; height: 38px; opacity: .35; filter: grayscale(.8); transition: all .4s cubic-bezier(.2,1.8,.4,1); font-size: 1rem; } .lights .av.on { opacity: 1; filter: none; transform: scale(1.25) translateY(-4px); box-shadow: 0 0 18px currentColor; }

/* respuestas especiales */
.swipe-wrap { position: relative; height: min(46vh, 340px); display: grid; place-items: center; touch-action: pan-y; user-select: none; }
.scard { width: min(100%, 420px); min-height: 240px; border-radius: 28px; padding: 24px; display: grid; gap: 12px; align-content: center; text-align: center; background: linear-gradient(160deg, #fff, #e7e1ff); color: #14102b; box-shadow: 0 18px 40px rgba(0,0,0,.5); cursor: grab; touch-action: none; position: relative; transition: transform .25s cubic-bezier(.2,1.2,.4,1); font-family: var(--font-display); font-size: clamp(1.3rem, 5vw, 1.9rem); line-height: 1.15; }
.scard.drag { transition: none; cursor: grabbing; } .scard small { font-family: var(--font-body); font-weight: 900; color: #6b5fa5; font-size: .95rem; }
.stamp { position: absolute; top: 12%; z-index: 3; font-family: var(--font-display); font-size: 2.2rem; border: 6px solid; border-radius: 14px; padding: 2px 14px; opacity: 0; pointer-events: none; }
.stamp.r { right: 6%; color: var(--a3); border-color: var(--a3); transform: rotate(14deg); background: rgba(13,10,36,.75); } .stamp.l { left: 6%; color: var(--a0); border-color: var(--a0); transform: rotate(-14deg); background: rgba(13,10,36,.75); }
.slider-box { display: grid; gap: 14px; } .slider-val { font-family: var(--font-display); font-size: clamp(3.4rem, 15vw, 6rem); text-align: center; line-height: 1; text-shadow: 0 5px 0 var(--pink); transition: transform .1s; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; border-radius: 99px; background: linear-gradient(90deg, var(--pink), var(--amber), var(--cyan)); outline-offset: 6px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 6px solid var(--ink); box-shadow: 0 4px 12px rgba(0,0,0,.5); cursor: grab; }
input[type=range]::-moz-range-thumb { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 6px solid var(--ink); cursor: grab; }
.olist { position: relative; touch-action: none; } .oi { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 16px; background: linear-gradient(135deg, var(--panel), #3d2d96); border: 3px solid var(--line); font-weight: 900; font-size: 1.1rem; transition: transform .25s cubic-bezier(.2,1,.3,1), box-shadow .2s; cursor: grab; touch-action: none; user-select: none; }
.oi.drag { transition: none; z-index: 5; box-shadow: 0 16px 30px rgba(0,0,0,.55); border-color: var(--amber); cursor: grabbing; } .oi .grip { font-size: 1.5rem; color: var(--mut); } .oi .pos { width: 36px; height: 36px; border-radius: 10px; background: var(--amber); color: #14102b; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.3rem; flex: none; } .oi .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.oi.good { border-color: var(--a3); background: linear-gradient(135deg, #14633a, #1c8a4f); }
.match { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 56px; }
.match svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; } .match path { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .5s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.mi { position: relative; z-index: 1; padding: 14px 16px; border-radius: 16px; border: 3px solid var(--line); background: rgba(255,255,255,.08); font-weight: 900; text-align: center; min-height: 58px; display: grid; place-items: center; transition: transform .12s, background .2s, border-color .2s; overflow-wrap: anywhere; }
.mi:hover { transform: scale(1.03); } .mi.sel { background: #fff; color: #14102b; transform: scale(1.06); } .mi.linked { color: #14102b; } .mi.ok { outline: 4px solid var(--a3); } .mi.bad { outline: 4px solid var(--a0); }
.done { text-align: center; padding: 28px 16px; display: grid; gap: 10px; place-items: center; }
.bigcheck { width: 110px; height: 110px; } .bigcheck circle { fill: var(--a3); } .bigcheck path { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw2 .5s .25s ease-out forwards; } @keyframes draw2 { to { stroke-dashoffset: 0; } }
.spin { width: 44px; height: 44px; border-radius: 50%; border: 6px solid rgba(255,255,255,.2); border-top-color: var(--amber); animation: sp 1s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
.sticky-act { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 5; }
.pbar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; } .pbar i { display: block; height: 100%; background: var(--cyan); border-radius: 99px; width: 100%; }

/* resultados */
.res-hero { text-align: center; padding: 26px 16px; border-radius: 28px; border: 4px solid rgba(255,255,255,.25); display: grid; gap: 6px; justify-items: center; position: relative; overflow: hidden; }
.res-hero.ok { background: linear-gradient(160deg, #1aa851, #0f6d35); animation: pop .5s cubic-bezier(.2,1.7,.4,1); } .res-hero.part { background: linear-gradient(160deg, #e69a00, #a35d00); }
.res-hero.bad { background: linear-gradient(160deg, #e0284d, #8d1033); animation: shake .5s; } .res-hero.none { background: linear-gradient(160deg, #4b3f9a, #2a2170); }
.res-hero h2 { font-size: clamp(2rem, 8vw, 3.2rem); } .pts { font-family: var(--font-display); font-size: 3rem; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.flame { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,.3); border-radius: 99px; padding: 4px 14px; font-weight: 900; } .flame svg { width: 22px; height: 22px; animation: flick .5s ease-in-out infinite alternate; } @keyframes flick { to { transform: scale(1.2) rotate(6deg); } }
.stat { display: grid; gap: 4px; text-align: center; } .stat .num { font-family: var(--font-display); font-size: clamp(2.4rem, 9vw, 4rem); line-height: 1; }
.board { position: relative; } .brow { position: absolute; left: 0; right: 0; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 8px; border-radius: 18px; background: rgba(255,255,255,.09); border: 1px solid var(--line); overflow: hidden; transition: transform .9s cubic-bezier(.3,1.2,.4,1), opacity .5s; }
.brow .fb { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, color-mix(in srgb, var(--film) 55%, transparent), transparent); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); } .brow > * { position: relative; }
.brow .rk { font-family: var(--font-display); font-size: 1.5rem; width: 2ch; text-align: center; } .brow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.15rem; } .brow .sc { font-family: var(--font-display); font-size: 1.5rem; min-width: 4ch; text-align: right; }

/* ---- ranking animado (FLIP) ---- */
function mountBoard(box, players, meId, max, final) {
  const H_ = 68, list = players.slice(0, max), prevScore = {}, prevIdx = {};
  const old = [...players].map(p => ({ ...p, ps: p.score - (final ? 0 : p.last || 0) })).sort((a, b) => b.ps - a.ps || a.name.localeCompare(b.name));
  old.forEach((p, i) => { prevScore[p.id] = p.ps; prevIdx[p.id] = i; });
  const extra = meId && !list.find(p => p.id === meId) ? players.find(p => p.id === meId) : null; const rows = extra ? [...list, extra] : list;
  box.style.height = rows.length * H_ + "px"; const top = Math.max(1, ...players.map(p => p.score));
  box.innerHTML = rows.map((p, i) => `<div class="brow ${p.id === meId ? "me" : ""}" data-id="${esc(p.id)}" style="transform:translateY(${(final ? i : Math.min(prevIdx[p.id] ?? i, max)) * H_}px);opacity:${final || (prevIdx[p.id] ?? i) < max ? 1 : 0}">
      <div class="fb" data-w="${Math.max(4, Math.round(100 * p.score / top))}"></div><span class="rk">${p.rank}</span>${avatar(p)}<span class="nm">${esc(p.name)}${p.id === meId ? " (tú)" : ""}</span>
      ${p.streak >= 2 ? `<span class="st">racha ×${p.streak}</span>` : ""}${!final && p.last ? `<span class="gain">+${p.last}</span>` : ""}<span class="sc" data-s="${p.score}" data-f="${final ? 0 : prevScore[p.id] ?? 0}">${final ? 0 : prevScore[p.id] ?? 0}</span></div>`).join("");
  requestAnimationFrame(() => setTimeout(() => {
    rows.forEach((p, i) => { const el = $(`[data-id="${CSS.escape(p.id)}"]`, box); if (!el) return; el.style.transform = `translateY(${i * H_}px)`; el.style.opacity = 1; $(".fb", el).style.width = $(".fb", el).dataset.w + "%"; const sc = $(".sc", el); countUp(sc, +sc.dataset.f, +sc.dataset.s, 1100); });
    if (rows.some(p => (prevIdx[p.id] ?? 0) !== players.indexOf(p))) whoosh();
  }, final ? 100 : 700));
}

/* ---- temporizador ---- */
function stopTimer() { cancelAnimationFrame(rafT); rafT = 0; }
function startTimer() {
  stopTimer(); const total = Math.max(ST.q.dur * 1000, ST.endsAt - nowS()); let lastSec = -1;
  const loop = () => {
    const s = ST; if (!s || s.phase !== "q") return;
    const rem = Math.max(0, s.endsAt - nowS()), sec = Math.ceil(rem / 1000), r = $("#ring");
    if (r) { r.querySelector(".bar").style.strokeDashoffset = String(100 * (1 - Math.min(1, rem / total))); r.querySelector("b").textContent = sec; r.classList.toggle("warn", sec <= 10 && sec > 5); r.classList.toggle("hot", sec <= 5); }

    speed = sec <= 5 ? 3 : 1;
    if (sec !== lastSec) { lastSec = sec; if (rem > 0 && sec <= 5) beep(880, .07, "square", .03); }
    PQ.onTick?.(rem, total);
    rafT = requestAnimationFrame(loop);

function playQuestion() {
  const s = ST, q = s.q; PQ = { locked: !!s.me?.answered, sel: null };
  view(`<div class="top"><div class="row">${filmChip(FILMS[q.film])}<span class="chip dark">${q.n + 1}/${s.total}</span></div>${ringHTML()}</div>
    ${q.type === "tf" ? "" : qBody(q)}<div id="inp" style="display:grid;gap:12px"></div><div class="gap-dock"></div>`);
  const box = $("#inp");
  if (PQ.locked) box.innerHTML = pAnsweredView(); else { ({ mc: mountChoice, img: mountChoice, imgopt: mountChoice, tf: mountSwipe, multi: mountMulti, type: mountType, slider: mountSlider, order: mountOrder, match: mountMatch })[q.type](box, q); }
  startTimer();
  PQ.onTick = rem => { if (rem <= 0 && !PQ.locked) { PQ.locked = true; const auto = PQ.auto?.(); if (auto !== undefined) { submitAnswer(auto, true); } else box.innerHTML = `<div class="done"><h2>¡Se acabó el tiempo!</h2><p class="mut">Mira la pantalla para ver la respuesta.</p></div>`; PQ.onTick = null; } };
}
function mountChoice(box, q) {
  if (q.type === "imgopt") { box.innerHTML = `<div class="opts one">${q.imgs.map((u, i) => `<button class="opt imgtile" style="--i:${i}" data-i="${i}" aria-label="${esc(q.alts[i])}"><img src="${esc(u)}" alt=""><span class="letter" style="background:${COLORS[i]}">${"ABC"[i]}</span></button>`).join("")}</div>`; }
  else box.innerHTML = `<div class="opts one">${q.opts.map((o, i) => `<button class="opt c${i}" style="--i:${i}" data-i="${i}">${shapeSVG(i)}<span class="t">${esc(o)}</span></button>`).join("")}</div>`;
  $$("button.opt", box).forEach(b => b.onclick = () => { $$("button.opt", box).forEach(x => x.setAttribute("aria-pressed", String(x === b))); submitAnswer(+b.dataset.i); });
}
function mountSwipe(box, q) {
  box.innerHTML = `<div class="swipe-wrap"><div class="stamp l">FALSO</div><div class="stamp r">VERDADERO</div><div class="scard" id="sc"><small>Verdadero o falso</small>${esc(q.text)}<small>← Falso · Verdadero →</small></div></div>
    <div class="opts"><button class="opt c0" id="bf">${shapeSVG(0)}<span class="t">Falso</span></button><button class="opt c1" id="bt">${shapeSVG(1)}<span class="t">Verdadero</span></button></div>`;
  const card = $("#sc"), sl = $(".stamp.l", box), sr = $(".stamp.r", box); let x0 = 0, dx = 0, drag = false;
  const fly = dir => { if (PQ.locked) return; card.style.transition = "transform .35s ease-in"; card.style.transform = `translateX(${dir * 140}%) rotate(${dir * 30}deg)`; submitAnswer(dir > 0 ? 0 : 1); };
  card.onpointerdown = e => { if (PQ.locked) return; drag = true; x0 = e.clientX; card.setPointerCapture(e.pointerId); card.classList.add("drag"); };
  card.onpointermove = e => { if (!drag) return; dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`; const k = Math.min(1, Math.abs(dx) / 110); sr.style.opacity = dx > 0 ? k : 0; sl.style.opacity = dx < 0 ? k : 0; };
  const end = () => { if (!drag) return; drag = false; card.classList.remove("drag"); if (Math.abs(dx) > 110) fly(dx > 0 ? 1 : -1); else { card.style.transform = ""; sr.style.opacity = sl.style.opacity = 0; } dx = 0; };
  card.onpointerup = end; card.onpointercancel = end;
  $("#bt").onclick = () => fly(1); $("#bf").onclick = () => fly(-1);
}
function mountMulti(box, q) {
  PQ.sel = [];
  box.innerHTML = `<div class="hint">Marca todas las que correspondan</div><div class="opts one">${q.opts.map((o, i) => `<button class="opt c${i}" style="--i:${i}" data-i="${i}" aria-pressed="false">${shapeSVG(i)}<span class="t">${esc(o)}</span></button>`).join("")}</div><div class="sticky-act"><button class="btn big pink" id="send" disabled>Enviar</button></div>`;
  $$("button.opt", box).forEach(b => b.onclick = () => { if (PQ.locked) return; const i = +b.dataset.i, on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); PQ.sel = on ? [...PQ.sel, i] : PQ.sel.filter(x => x !== i); $("#send").disabled = !PQ.sel.length; beep(on ? 700 : 500, .05, "triangle", .03); });
  $("#send").onclick = () => submitAnswer([...PQ.sel].sort((a, b) => a - b)); PQ.auto = () => PQ.sel.length ? [...PQ.sel].sort((a, b) => a - b) : undefined;
}
function mountType(box) {
  box.innerHTML = `<input class="field" id="txt" placeholder="Escribe tu respuesta" autocomplete="off" autocapitalize="words" maxlength="40"><button class="btn big pink" id="send">Enviar</button>`;
  const go = () => { const v = $("#txt").value.trim(); if (v) submitAnswer(v); };
  $("#send").onclick = go; $("#txt").onkeydown = e => { if (e.key === "Enter") go(); }; $("#txt").oninput = () => beep(900 + Math.random() * 200, .02, "square", .01); PQ.auto = () => $("#txt")?.value.trim() || undefined;
}
function mountSlider(box, q) {
  const mid = Math.round((q.min + q.max) / 2); PQ.sel = mid;
  box.innerHTML = `<div class="slider-box"><div class="slider-val" id="sv">${mid}</div><input type="range" id="rg" min="${q.min}" max="${q.max}" step="${q.step}" value="${mid}" aria-label="Tu respuesta"><div class="row between mut"><span>${q.min}</span><span>${q.max}</span></div><button class="btn big pink" id="send">Enviar</button></div>`;
  $("#rg").oninput = e => { PQ.sel = +e.target.value; const v = $("#sv"); v.textContent = PQ.sel; v.style.transform = "scale(1.08)"; setTimeout(() => v.style.transform = "", 90); beep(300 + (PQ.sel - q.min) / (q.max - q.min) * 600, .03, "triangle", .02); navigator.vibrate?.(5); };
  $("#send").onclick = () => submitAnswer(PQ.sel); PQ.auto = () => PQ.sel;
}
function mountOrder(box, q) {
  const n = q.opts.length, Hh = 64, gap = 10, order = q.opts.map((_, i) => i);
  box.innerHTML = `<div class="hint">Arrastra las tarjetas para ordenarlas</div><div class="olist" style="height:${n * (Hh + gap)}px">${q.opts.map((t, i) => `<div class="oi" data-i="${i}"><span class="grip">⠿</span><span class="pos"></span><span class="ot">${esc(t)}</span></div>`).join("")}</div><div class="sticky-act"><button class="btn big pink" id="send">Enviar orden</button></div>`;
  const els = $$(".oi", box);
  const layout = skip => order.forEach((idx, pos) => { const el = els[idx]; el.querySelector(".pos").textContent = pos + 1; if (el !== skip) el.style.transform = `translateY(${pos * (Hh + gap)}px)`; });
  layout();
  els.forEach(el => el.onpointerdown = e => {
    if (PQ.locked) return; el.setPointerCapture(e.pointerId); const idx = +el.dataset.i, y0 = e.clientY, p0 = order.indexOf(idx); el.classList.add("drag"); beep(500, .05, "triangle", .03);
    const move = ev => { let y = p0 * (Hh + gap) + (ev.clientY - y0); y = Math.max(0, Math.min(y, (n - 1) * (Hh + gap))); el.style.transform = `translateY(${y}px) scale(1.03)`; const np = Math.round(y / (Hh + gap)), cur = order.indexOf(idx); if (np !== cur) { order.splice(cur, 1); order.splice(np, 0, idx); layout(el); beep(420 + np * 60, .04, "sine", .03); navigator.vibrate?.(8); } };
    const up = () => { el.classList.remove("drag"); layout(); el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  });
  $("#send").onclick = () => submitAnswer([...order]); PQ.auto = () => [...order];
}
function mountMatch(box, q) {
  const n = q.left.length, pairs = Array(n).fill(-1); let sel = null;
  box.innerHTML = `<div class="hint">Toca un elemento de la izquierda y luego su pareja</div><div class="match" id="mt"><svg class="lines" id="ln"></svg><div style="display:grid;gap:12px">${q.left.map((l, i) => `<button class="mi" data-l="${i}">${esc(l)}</button>`).join("")}</div><div style="display:grid;gap:12px">${q.right.map((r, j) => `<button class="mi" data-r="${j}">${esc(r)}</button>`).join("")}</div></div><div class="sticky-act"><button class="btn big pink" id="send" disabled>Enviar</button></div>`;
  const mt = $("#mt"), L = $$("[data-l]", box), R = $$("[data-r]", box), ln = $("#ln");
  const paint = () => {
    L.forEach((b, i) => { b.classList.toggle("sel", sel === i); const j = pairs[i]; b.classList.toggle("linked", j >= 0); b.style.background = j >= 0 ? COLORS[i] : ""; });
    R.forEach((b, j) => { const li = pairs.indexOf(j); b.classList.toggle("linked", li >= 0); b.style.background = li >= 0 ? COLORS[li] : ""; });
    const mr = mt.getBoundingClientRect(); ln.setAttribute("viewBox", `0 0 ${mr.width} ${mr.height}`);
    ln.innerHTML = pairs.map((j, i) => { if (j < 0) return ""; const a = L[i].getBoundingClientRect(), b = R[j].getBoundingClientRect(), x1 = a.right - mr.left, y1 = a.top + a.height / 2 - mr.top, x2 = b.left - mr.left, y2 = b.top + b.height / 2 - mr.top, mx = (x1 + x2) / 2; return `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" stroke="${COLORS[i]}"/>`; }).join("");
    $("#send").disabled = pairs.includes(-1);
  };
  L.forEach((b, i) => b.onclick = () => { if (PQ.locked) return; if (pairs[i] >= 0) { pairs[i] = -1; sel = i; } else sel = sel === i ? null : i; beep(600, .04, "triangle", .03); paint(); });
  R.forEach((b, j) => b.onclick = () => { if (PQ.locked || sel === null) return; const prev = pairs.indexOf(j); if (prev >= 0) pairs[prev] = -1; pairs[sel] = j; sel = null; beep(800, .06, "triangle", .04); navigator.vibrate?.(10); paint(); });
  paint(); PQ.auto = () => pairs.includes(-1) ? undefined : [...pairs]; $("#send").onclick = () => submitAnswer([...pairs]);
  addEventListener("resize", paint);
}

const FLAME = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffb300" d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/><path fill="#ff3b3b" d="M12 22a3 3 0 0 1-3-3c0-2 2-2 2-4 2 1 4 2 4 4a3 3 0 0 1-3 3z"/></svg>`;
function playResult() {
  const s = ST, q = s.q, rv = s.reveal, me = s.me, r = me?.result;
  let cls = "none", h = "Sin respuesta", sub = "Esta vez no alcanzaste a responder.";
  if (r) { if (r.ok === 1) { cls = "ok"; h = "¡Correcto!"; sub = "Bien hecho"; } else if (r.ok === 0.5) { cls = "part"; h = "¡Casi!"; sub = `Acertaste el ${r.f}%.`; } else if (r.ok === 0) { cls = "bad"; h = "Incorrecto"; sub = "No pasa nada, la siguiente es tuya."; } }
  view(`<div class="res-hero ${cls}"><h2>${h}</h2><div>${sub}</div><div class="pts">+<span id="pp">0</span></div>${r && r.streak >= 2 ? `<div class="flame">${FLAME} Racha de ${r.streak}${r.bonus ? ` · +${r.bonus} de bono` : ""}</div>` : ""}</div>
    <div class="card"><div class="mut">Respuesta correcta</div><div style="font-family:var(--font-display);font-size:1.5rem;overflow-wrap:anywhere">${esc(rv.ctext)}</div><p class="mut" style="margin:6px 0 0">${esc(rv.expl)}</p></div>
    <div class="row"><div class="card grow stat"><span class="mut">Tu puntaje</span><span class="num" id="tt">0</span></div><div class="card grow stat"><span class="mut">Posición</span><span class="num">${me?.rank || "–"}º</span></div></div><div class="gap-dock"></div>`);
  countUp($("#pp"), 0, r?.pts || 0, 900); countUp($("#tt"), (r?.total || 0) - (r?.pts || 0), r?.total || 0, 1100);
  if (r) { jingle(r.ok === 1); navigator.vibrate?.(r.ok === 1 ? [40, 40, 40] : 140); if (r.ok === 1) confetti(90, { x: innerWidth / 2, y: innerHeight * .25 }); }
}
function playBoard() {
  const s = ST; view(`<h1 style="font-size:2.2rem;text-align:center">Ranking</h1><div class="card"><div class="board" id="board"></div></div><p class="hint">Atento a la pantalla. Viene la siguiente pregunta.</p><div class="gap-dock"></div>`);
  mountBoard($("#board"), s.players, S.id, 5);
}
function playEnd() {
  const s = ST, me = s.players.find(p => p.id === S.id);
  view(`<div class="res-hero ${me && me.rank <= 3 ? "ok" : "none"}"><h2>${me ? (me.rank === 1 ? "¡Campeón del cine!" : me.rank <= 3 ? "¡Subiste al podio!" : "¡Buena partida!") : "Partida terminada"}</h2>${me ? `<div class="pts">${me.rank}º lugar · ${me.score} pts</div>` : ""}</div>
    <div class="card"><h2 style="font-size:1.5rem;margin-bottom:10px">Clasificación</h2><div class="board" id="board"></div></div>
    <div class="row center"><button class="btn ghost" id="home">Salir</button></div><div class="gap-dock"></div>`);
  mountBoard($("#board"), s.players, S.id, 15, true); if (me && me.rank <= 3) { confetti(220); jingle(true); }
  $("#home").onclick = () => { sess.set("kms-play", null); leave(); };
}

/* ================= arranque ================= */
document.addEventListener("keydown", e => {
  if (S.role !== "host" || !ST || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if (e.key === " " || e.key === "Enter") { const b = $("#next") || (ST.phase === "lobby" ? $("#start") : null); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});
addEventListener("hashchange", () => { if (!S.role) route(); });
if (location.hash === "#host") hostEntry(); else { const pin = new URLSearchParams(location.search).get("pin"); const sv = sess.get("kms-play"); if (sv && !pin) { S.role = "play"; S.code = sv.code; S.id = sv.id; S.token = sv.token; S.name = sv.name; connect(); view(`<div class="done"><div class="spin"></div><p>Volviendo a la sala…</p></div>`); } else landing(); }
</script>
