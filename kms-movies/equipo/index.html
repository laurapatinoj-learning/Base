<title>Equipo KMS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Concepto: foto de equipo con un círculo sobre cada cara; al elegir uno, el resto se apaga y la cara salta al panel como avatar redondo. */
:root {
  --ink: #0d0a24; --ink-2: #1b1346; --panel: #271c66; --line: rgba(255,255,255,.16); --fg: #fff; --mut: #c4bdf0;
  --pink: #ff3b8d; --amber: #ffc21a; --cyan: #22d3ee; --lime: #7cf24a;
  --font-display: "Lilita One", "Arial Black", Impact, sans-serif; --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--font-body); font-weight: 700; line-height: 1.4;
  padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: radial-gradient(60vmax 60vmax at -10% -10%, #5b21b655, transparent 60%), radial-gradient(50vmax 50vmax at 110% 20%, #db277755, transparent 60%), radial-gradient(50vmax 50vmax at 30% 120%, #0ea5e955, transparent 60%); background-attachment: fixed; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.wrap { max-width: 1240px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > *, .layout > * { min-width: 0; }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
header h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1; text-shadow: 0 4px 0 var(--pink); }
header p { margin: 6px 0 0; color: var(--mut); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 2px solid var(--line); background: rgba(255,255,255,.08); border-radius: 14px; padding: 8px 14px; font-weight: 900; cursor: pointer; transition: transform .1s, background .2s; }
.btn:hover { background: rgba(255,255,255,.16); transform: translateY(-2px); } .btn:active { transform: translateY(2px); }
.btn[aria-pressed="true"] { background: var(--amber); color: #14102b; border-color: var(--amber); }
.btn.pink { background: var(--pink); border-color: var(--pink); }
.layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.stage { position: relative; border-radius: 24px; overflow: hidden; border: 3px solid var(--line); background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.5); touch-action: manipulation; }
.stage svg { display: block; width: 100%; height: auto; }
.seg { fill: transparent; stroke: rgba(255,255,255,.95); stroke-width: 2.5; pointer-events: all; cursor: pointer; transition: fill .15s, stroke .15s, stroke-width .15s; filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
.seg:hover, .seg:focus-visible { fill: rgba(255,194,26,.25); stroke: var(--amber); stroke-width: 4; outline: none; }
.seg.on { fill: transparent; stroke: transparent; }
#ring { fill: none; stroke: var(--amber); stroke-width: 5; stroke-dasharray: 14 9; animation: march 1s linear infinite; pointer-events: none; filter: drop-shadow(0 0 8px #ffc21a); }
@keyframes march { to { stroke-dashoffset: -23; } }
#lift { pointer-events: none; filter: drop-shadow(0 8px 12px rgba(0,0,0,.65)); }
#dim { pointer-events: none; transition: opacity .25s; }
.tag { pointer-events: none; font-family: var(--font-display); font-size: 20px; fill: #14102b; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; }
.tip { position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, -150%); background: #14102b; color: #fff; border: 2px solid var(--amber); border-radius: 10px; padding: 3px 10px; font-size: .85rem; white-space: nowrap; opacity: 0; transition: opacity .1s; }
.tip.show { opacity: 1; }
.panel { background: linear-gradient(160deg, var(--panel), var(--ink-2)); border: 2px solid var(--line); border-radius: 24px; padding: 16px; display: grid; gap: 14px; position: sticky; top: 12px; }
.avatar { width: min(100%, 300px); aspect-ratio: 1; margin-inline: auto; border-radius: 50%; overflow: hidden; border: 6px solid var(--amber); background: #fff; box-shadow: 0 0 0 6px #ffc21a33, 0 14px 30px rgba(0,0,0,.45); animation: pop .45s cubic-bezier(.2,1.5,.4,1) both; }
.avatar svg { display: block; width: 100%; height: 100%; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.empty { text-align: center; color: var(--mut); padding: 30px 12px; display: grid; gap: 8px; place-items: center; }
.empty b { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.num { display: inline-grid; place-items: center; min-width: 38px; height: 38px; border-radius: 50%; background: var(--amber); color: #14102b; font-family: var(--font-display); font-size: 1.3rem; padding: 0 8px; }
dl { margin: 0; display: grid; gap: 8px; } dl div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; } dt { color: var(--mut); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; padding-top: 2px; } dd { margin: 0; }
label.f { display: grid; gap: 4px; } label.f span { color: var(--mut); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.in { width: 100%; border: 2px solid var(--line); background: rgba(0,0,0,.35); border-radius: 12px; padding: 9px 12px; font-weight: 800; }
.in:focus { border-color: var(--cyan); outline: none; }
.roster { display: flex; gap: 12px; overflow-x: auto; padding: 8px 4px 12px; scroll-snap-type: x proximity; }
.chip { flex: none; scroll-snap-align: start; width: 84px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 4px; justify-items: center; transition: transform .12s; }
.chip:hover { transform: translateY(-4px); }
.chip .c { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; border: 4px solid var(--line); background: #fff; transition: border-color .2s, box-shadow .2s; }
.chip svg { display: block; width: 100%; height: 100%; }
.chip[aria-pressed="true"] { transform: translateY(-4px) scale(1.08); } .chip[aria-pressed="true"] .c { border-color: var(--amber); box-shadow: 0 0 0 4px #ffc21a55; }
.chip small { font-size: .74rem; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mut); }
.note { color: var(--mut); font-size: .85rem; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #fff; color: #14102b; padding: 10px 18px; border-radius: 12px; font-weight: 900; z-index: 9; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .panel { position: static; } .avatar { width: min(70%, 260px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let sel = null, edits = store.get("kms-equipo") || {};
const ids = DATA.map(p => p.id), byId = Object.fromEntries(DATA.map(p => [p.id, p]));
const label = p => (edits[p.id]?.name || "").trim() || "Persona " + p.id;
const setC = (el, f, k = 1) => { el.setAttribute("cx", f[0]); el.setAttribute("cy", f[1]); el.setAttribute("r", f[2] * k); };

const segs = $("#segs"), tags = $("#tags"), tip = $("#tip"), stage = $("#stage");
DATA.forEach(p => {
  const s = document.createElementNS(NS, "circle"); setC(s, p.face); s.setAttribute("class", "seg"); s.setAttribute("tabindex", "0"); s.setAttribute("role", "button"); s.dataset.id = p.id;
  s.addEventListener("click", () => select(p.id));
  s.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(p.id); } });
  s.addEventListener("pointermove", e => { const r = stage.getBoundingClientRect(); tip.textContent = label(p); tip.style.left = e.clientX - r.left + "px"; tip.style.top = e.clientY - r.top + "px"; tip.classList.add("show"); });
  s.addEventListener("pointerleave", () => tip.classList.remove("show"));
  segs.appendChild(s);
  const t = document.createElementNS(NS, "text"); t.setAttribute("class", "tag"); t.setAttribute("x", p.face[0]); t.setAttribute("y", p.face[1] + p.face[2] + 16); t.textContent = p.id; tags.appendChild(t);
});
const setLabels = () => document.querySelectorAll(".seg").forEach(s => { const p = byId[s.dataset.id]; s.setAttribute("aria-label", `${label(p)}: ${p.info.resumen}`); });

/* Avatar redondo: recorte cuadrado alrededor del círculo de la cara */
function faceSVG(p, k = 1.06) {
  const [cx, cy, r] = p.face, R = r * k;
  return `<svg viewBox="${cx - R} ${cy - R} ${2 * R} ${2 * R}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#img"/></svg>`;
}
const roster = $("#roster");
DATA.forEach(p => {
  const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", "false"); b.dataset.id = p.id;
  b.innerHTML = `<span class="c">${faceSVG(p)}</span><small>${esc(label(p))}</small>`; b.onclick = () => select(p.id); roster.appendChild(b);
});

function select(id) {
  sel = id; const p = byId[id];
  document.querySelectorAll(".seg").forEach(s => s.classList.toggle("on", +s.dataset.id === id));
  setC($("#maskHole"), p.face); $("#dim").setAttribute("opacity", ".66");
  setC($("#liftC"), p.face); const lift = $("#lift"); lift.hidden = false;
  const ring = $("#ring"); setC(ring, p.face); ring.hidden = false;
  document.querySelectorAll(".chip").forEach(c => { const on = +c.dataset.id === id; c.setAttribute("aria-pressed", String(on)); if (on) roster.scrollTo({ left: c.offsetLeft - (roster.clientWidth - c.clientWidth) / 2, behavior: "smooth" }); });
  renderPanel();
}
function clearSel() {
  sel = null; $("#dim").setAttribute("opacity", "0"); $("#lift").hidden = true; $("#ring").hidden = true;
  document.querySelectorAll(".seg").forEach(s => s.classList.remove("on")); document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false")); renderPanel();
}
function renderPanel() {
  const el = $("#panel");
  if (sel === null) { el.innerHTML = `<div class="empty"><b>Elige una cara</b><span>Toca un círculo en la foto o una cara de la tira de abajo. Aquí verás su avatar y su información.</span></div>`; return; }
  const p = byId[sel], i = p.info, e = edits[p.id] || {};
  el.innerHTML = `<div class="row"><span class="num">${p.id}</span><div class="row" style="gap:6px"><button class="btn" id="prev" aria-label="Anterior">←</button><button class="btn" id="next" aria-label="Siguiente">→</button><button class="btn" id="close" aria-label="Quitar selección">✕</button></div></div>
    <div class="avatar">${faceSVG(p, 1.12)}</div>
    <h2 style="font-size:1.5rem;text-align:center">${esc(label(p))}</h2><p style="margin:0;color:var(--mut);text-align:center">${esc(i.resumen)}</p>
    <dl><div><dt>Ubicación</dt><dd>${esc(i.ubicacion)}</dd></div><div><dt>Cabello</dt><dd>${esc(i.cabello)}</dd></div><div><dt>Ropa</dt><dd>${esc(i.ropa)}</dd></div><div><dt>Accesorios</dt><dd>${esc(i.accesorios)}</dd></div><div><dt>Círculo</dt><dd>centro (${p.face[0]}, ${p.face[1]}) · radio ${p.face[2]} px</dd></div></dl>
    <label class="f"><span>Nombre</span><input class="in" id="fName" maxlength="40" placeholder="Persona ${p.id}" value="${esc(e.name || "")}"></label>
    <label class="f"><span>Rol o nota</span><input class="in" id="fRole" maxlength="80" placeholder="Ej. Dirección, Producción…" value="${esc(e.role || "")}"></label>`;
  $("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1); $("#close").onclick = clearSel;
  const save = () => { edits[p.id] = { name: $("#fName").value, role: $("#fRole").value }; store.set("kms-equipo", edits); setLabels(); document.querySelectorAll(".chip").forEach(c => { c.querySelector("small").textContent = label(byId[c.dataset.id]); }); $("#panel h2").textContent = label(p); };
  $("#fName").oninput = save; $("#fRole").oninput = save;
}
const step = d => select(ids[(ids.indexOf(sel) + d + ids.length) % ids.length]);
document.addEventListener("keydown", e => { if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return; if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "Escape") clearSel(); });

$("#tNum").onclick = e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", String(on)); tags.style.display = on ? "" : "none"; };
$("#tAll").onclick = clearSel;
$("#tCopy").onclick = async () => {
  const out = DATA.map(p => ({ id: p.id, nombre: label(p), rol: edits[p.id]?.role || "", ubicacion: p.info.ubicacion, cabello: p.info.cabello, ropa: p.info.ropa, accesorios: p.info.accesorios, cara: { cx: p.face[0], cy: p.face[1], radio: p.face[2] } }));
  try { await navigator.clipboard.writeText(JSON.stringify(out, null, 2)); toast("Datos copiados"); } catch (e) { toast("No se pudo copiar"); }
};
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; t.setAttribute("role", "status"); document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
setLabels(); renderPanel();
</script>
