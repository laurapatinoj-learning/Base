name: Publicar en GitHub Pages

# Publica la página del juego. El servidor en tiempo real va aparte (Render, ver render.yaml).
# Antes de usarlo: Settings > Pages > Source = "GitHub Actions" y, en Settings > Secrets and variables >
# Actions > Variables, crea KMS_API_URL con la dirección de Render (https://kms-movies.onrender.com).
on:
  push:
    branches: [main]
    paths: ["kms-movies/server/public/**", "kms-movies/server/build-static.js", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir la página
        run: node kms-movies/server/build-static.js dist
        env:
          KMS_API_URL: ${{ vars.KMS_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
